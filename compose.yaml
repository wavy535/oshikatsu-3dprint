name: oshinest
services:
  postgres:
    build: ./infra/local/postgres
    environment:
      POSTGRES_DB: oshinest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-password
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oshinest"]
      interval: 3s
      timeout: 3s
      retries: 20
  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["s3-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:58025:8025"]
volumes:
  postgres-data:
  s3-data:
