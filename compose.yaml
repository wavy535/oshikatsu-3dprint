name: oshinest
services:
  postgres:
    build: ./infra/local/postgres
    environment:
      POSTGRES_DB: oshinest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-password
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oshinest"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:58025:8025"]
volumes:
  postgres-data:
